name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend verify + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run unit tests
        run: python -m pytest backend/tests/ -q
      - name: Run feature gate
        # backend 任务没有 npm ci；前端构建/测试由下面的 frontend job 负责。
        # --skip-build 只跳过 vite build，不会跳过 vitest。
        run: python backend/scripts/verify_feature.py --skip-build --skip-frontend-tests

  frontend:
    name: Frontend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        working-directory: portal/frontend
        run: npm ci
      - name: Run unit tests
        working-directory: portal/frontend
        run: npm test
      - name: Build
        working-directory: portal/frontend
        run: npm run build

  node-preview:
    name: Node gateway preview
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: coati_node_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/coati_node_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm verify:gateway
      - run: pnpm test
      - run: pnpm build
      - run: docker build -t coati-node-preview .
