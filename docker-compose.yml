services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: coati
      POSTGRES_USER: coati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - node_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U coati -d coati]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    stop_grace_period: 210s
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-8080}:5000"
    environment: &gateway_environment
      NODE_ENV: production
      DATABASE_URL: postgresql://coati:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db/coati
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      GATEWAY_ENCRYPTION_KEY: ${GATEWAY_ENCRYPTION_KEY:?Set GATEWAY_ENCRYPTION_KEY}
      GATEWAY_PREVIOUS_ENCRYPTION_KEYS: ${GATEWAY_PREVIOUS_ENCRYPTION_KEYS:-[]}
      GATEWAY_TRUSTED_PROXY_URL: ${GATEWAY_TRUSTED_PROXY_URL:-}
      AGENT_WEBSEARCH_PROVIDER: ${AGENT_WEBSEARCH_PROVIDER:-}
      AGENT_WEBSEARCH_API_KEY: ${AGENT_WEBSEARCH_API_KEY:-}
      AGENT_WEBSEARCH_PROXY_URL: ${AGENT_WEBSEARCH_PROXY_URL:-}
      AGENT_WEBSEARCH_TIMEOUT_SECONDS: ${AGENT_WEBSEARCH_TIMEOUT_SECONDS:-15}
      AGENT_WEB_SEARCH_SHORTCUT_ENABLED: ${AGENT_WEB_SEARCH_SHORTCUT_ENABLED:-true}
      GATEWAY_ALLOW_PRIVATE_UPSTREAMS: ${GATEWAY_ALLOW_PRIVATE_UPSTREAMS:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD}
      ENABLE_TASK_SCHEDULER: "false"
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      AGENT_DEVICE_STARTS_PER_MINUTE: ${AGENT_DEVICE_STARTS_PER_MINUTE:-60}
      AGENT_DEVICE_MAX_ACTIVE: ${AGENT_DEVICE_MAX_ACTIVE:-5000}
      AGENT_DEVICE_RETENTION_HOURS: ${AGENT_DEVICE_RETENTION_HOURS:-24}
      AGENT_DAILY_TOKEN_QUOTA: ${AGENT_DAILY_TOKEN_QUOTA:-0}
      AGENT_SESSION_AFFINITY_ENABLED: ${AGENT_SESSION_AFFINITY_ENABLED:-true}
      AGENT_SESSION_AFFINITY_TTL_SECONDS: ${AGENT_SESSION_AFFINITY_TTL_SECONDS:-3600}
      AGENT_GATEWAY_MAX_ATTEMPTS: ${AGENT_GATEWAY_MAX_ATTEMPTS:-3}
      AGENT_GATEWAY_SELECTION_POOL_SIZE: ${AGENT_GATEWAY_SELECTION_POOL_SIZE:-7}
      AGENT_CREDENTIAL_UNHEALTHY_RETRY_SECONDS: ${AGENT_CREDENTIAL_UNHEALTHY_RETRY_SECONDS:-300}
      AGENT_CREDENTIAL_SOFT_RETRY_SECONDS: ${AGENT_CREDENTIAL_SOFT_RETRY_SECONDS:-10}
      AGENT_CREDENTIAL_FAILURE_THRESHOLD: ${AGENT_CREDENTIAL_FAILURE_THRESHOLD:-3}
      AGENT_CREDENTIAL_COOLDOWN_SECONDS: ${AGENT_CREDENTIAL_COOLDOWN_SECONDS:-60}
      AGENT_QUOTA_RESERVATION_TTL_SECONDS: ${AGENT_QUOTA_RESERVATION_TTL_SECONDS:-3600}
      AGENT_QUOTA_DEFAULT_MAX_OUTPUT_TOKENS: ${AGENT_QUOTA_DEFAULT_MAX_OUTPUT_TOKENS:-4096}
      AGENT_QUOTA_MIN_COMPLETION_HEADROOM: ${AGENT_QUOTA_MIN_COMPLETION_HEADROOM:-0}
      AGENT_DEVICE_TTL_SECONDS: ${AGENT_DEVICE_TTL_SECONDS:-600}
      AGENT_DEVICE_INTERVAL_SECONDS: ${AGENT_DEVICE_INTERVAL_SECONDS:-5}
      AGENT_DEVICE_VERIFY_PATH: ${AGENT_DEVICE_VERIFY_PATH:-/agent/device-confirm}
      AGENT_LLM_KEY: ${AGENT_LLM_KEY:-}
      AGENT_LLM_BASE: ${AGENT_LLM_BASE:-}
      AGENT_LLM_MODEL: ${AGENT_LLM_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_API_BASE: ${AI_API_BASE:-}
      AI_MODEL: ${AI_MODEL:-}
      AGENT_CREDENTIAL_PROBE_INTERVAL_SECONDS: ${AGENT_CREDENTIAL_PROBE_INTERVAL_SECONDS:-300}
      AGENT_CREDENTIAL_PROBE_BATCH_LIMIT: ${AGENT_CREDENTIAL_PROBE_BATCH_LIMIT:-5}
      AGENT_CREDENTIAL_PROBE_QUIET_SECONDS: ${AGENT_CREDENTIAL_PROBE_QUIET_SECONDS:-600}
      AGENT_TIMEZONE: ${AGENT_TIMEZONE:-Asia/Shanghai}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - node_app_instance:/app/instance
  probe-worker:
    profiles: [recovery]
    build: .
    entrypoint: [node, dist/worker.js]
    restart: unless-stopped
    stop_grace_period: 45s
    environment:
      <<: *gateway_environment
      GATEWAY_ENABLE_PROBES: "true"
    depends_on:
      app:
        condition: service_healthy
    # The image's HTTP healthcheck is for the API, not this standalone worker.
    healthcheck:
      disable: true

volumes:
  node_postgres_data:
  node_app_instance:
